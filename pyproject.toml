[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme>=24.1.0"]
build-backend = "hatchling.build"

[project]
name = "verdis"
version = "0.1.1"
description = "Reproduce-first triage for vulnerability and security reports: run the proof of concept in a sandbox and get a verdict with an evidence bundle."
dynamic = ["readme"]
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Verdis contributors" }]
keywords = ["security", "triage", "vulnerability", "vulnerability-triage", "bug-bounty", "appsec", "devsecops", "psirt", "proof-of-concept", "sandbox", "sarif", "github-actions", "reproduction"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "sqlmodel>=0.0.22",
  "httpx>=0.27",
  "filelock>=3.13",
]

[project.urls]
Homepage = "https://github.com/usualdork/verdis"
Repository = "https://github.com/usualdork/verdis"
Issues = "https://github.com/usualdork/verdis/issues"
Documentation = "https://usualdork.github.io/verdis"
Changelog = "https://github.com/usualdork/verdis/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-mock>=3.12",
  "hypothesis>=6.100",
  "mypy>=1.10",
  "ruff>=0.5",
  "types-PyYAML>=6.0",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
]

[project.scripts]
verdis = "verdis.cli:main"

[project.entry-points."verdis.intake"]
file = "verdis.intake.file:FileIntake"
github = "verdis.intake.github:GitHubPrivateReportIntake"
github_issue = "verdis.intake.github_issue:GitHubIssueIntake"
imap = "verdis.intake.imap:ImapIntake"

[project.entry-points."verdis.llm"]
null = "verdis.extract.providers:NullProvider"
openai = "verdis.extract.providers:OpenAICompatibleProvider"
anthropic = "verdis.extract.providers:AnthropicProvider"
ollama = "verdis.extract.providers:OllamaProvider"

[project.entry-points."verdis.sandbox"]
podman = "verdis.sandbox.podman:PodmanBackend"
docker = "verdis.sandbox.docker:DockerBackend"
local = "verdis.sandbox.local:LocalBackend"

[project.entry-points."verdis.oracle"]
crash = "verdis.oracles.crash:CrashOracle"
sanitizer = "verdis.oracles.sanitizer:SanitizerOracle"
exception = "verdis.oracles.exception:ExceptionOracle"
canary = "verdis.oracles.canary:CanaryOracle"
differential = "verdis.oracles.differential:DifferentialOracle"
property = "verdis.oracles.property_:PropertyOracle"
output = "verdis.oracles.output:OutputOracle"

[project.entry-points."verdis.emitter"]
markdown = "verdis.emit.card:VerdictCardEmitter"
json = "verdis.emit.json_verdict:JsonVerdictEmitter"
sarif = "verdis.emit.sarif:SarifEmitter"
reply = "verdis.emit.reply:DraftReplyEmitter"

[tool.hatch.build.targets.wheel]
packages = ["src/verdis"]

[tool.hatch.build.targets.sdist]
# The three vendored upstream sources are benchmark data, not part of the
# package, and make up nearly all of the archive.
exclude = ["/benchmark/upstream"]

# PyPI shows the README without the repository around it, so the relative
# image and file links in it would be broken there. They are rewritten to
# absolute URLs when the package is built; the README itself stays relative.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '''(src|srcset)="(docs/[^"]+)"'''
replacement = '''\1="https://raw.githubusercontent.com/usualdork/verdis/main/\2"'''

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '''\]\((?!https?://|#|mailto:)([^)\s]+)\)'''
replacement = '''](https://github.com/usualdork/verdis/blob/main/\1)'''

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '''href="(?!https?://|#|mailto:)([^"]+)"'''
replacement = '''href="https://github.com/usualdork/verdis/blob/main/\1"'''

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repository root is importable, so a test can reach a helper in
# another test module. Without this the console script and
# "python -m pytest" disagree about what is importable, and the
# difference shows up as a red build.
pythonpath = ["."]
# The core is held to full coverage: a line nobody has exercised is a
# line nobody has thought about.
addopts = "-q --strict-markers --strict-config --cov=verdis --cov-report=term-missing --cov-fail-under=100"
markers = [
  "slow: long running or container-backed tests",
  "conformance: sandbox conformance suite",
  "adversarial: adversarial / injection suite",
  "e2e: end-to-end pipeline tests",
  "property: hypothesis property tests",
]
filterwarnings = ["error::DeprecationWarning:verdis.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
mypy_path = "src"
packages = ["verdis"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
ignore_errors = true
