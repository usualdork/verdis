name: Bug report

description: Something in Verdis does not work as documented
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you get?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      render: shell
      placeholder: |
        verdis triage report.md --repo ./libfoo --ref v2.3.1
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.1.0
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Output
      description: The verdict card, and any error output.
      render: shell
