name: Security report

description: Report a vulnerability in Verdis or in a project using it
title: "[security] "
labels: ["security"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not use this form for general bugs, and please do not
        disclose a vulnerability publicly before it has been fixed.

        If you are reporting a problem with a *report* that Verdis
        triaged, rather than a problem with Verdis itself, contact the
        maintainer of that project directly.

  - type: input
    id: impact
    attributes:
      label: What does this let an attacker do?
      description: What is the concrete effect? For example: escape the sandbox, reach the network, read a secret.
      placeholder: A proof of concept that reaches the network during the run stage
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: An RRS block or a script is ideal.
      render: shell
      placeholder: |
        verdis triage report.md --repo ./libfoo --ref v2.3.1
    validations:
      required: true

  - type: textarea
    id: rrs
    attributes:
      label: Reproducible Report Spec (optional)
      description: If your report carries an RRS block, paste it here.
      render: yaml
      placeholder: |
        rrs: 0.1
        target:
          repo: https://github.com/example/libfoo
          ref: v2.3.1
        steps:
          - run: ./build/parse_demo poc.bin

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This affects the sandbox boundary (escape, network, secrets, host access).
          required: false
        - label: This affects verdict accuracy in a way that could hide a real vulnerability.
          required: false
        - label: This affects the default configuration only.
          required: false
