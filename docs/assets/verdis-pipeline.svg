<text x="123" y="766" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#f1f5f2">Evidence bundle</text>
<text x="123" y="793" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif" font-size="16.5" font-weight="400" fill="#8d9c94">hashed manifest, rerun.sh</text>
