<text x="502.5" y="793" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif" font-size="16.5" font-weight="400" fill="#8d9c94">what was and was not shown</text>
<line x1="420.5" y1="742" x2="420.5" y2="798" stroke="#1f2a25" stroke-width="1"/>
<g transform="translate(830 749) scale(1.5)" fill="none" stroke="#3ddc97" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></g>
<text x="882" y="766" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#f1f5f2">Draft reply</text>
<text x="882" y="793" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif" font-size="16.5" font-weight="400" fill="#8d9c94">yours to approve or discard</text>
<line x1="800" y1="742" x2="800" y2="798" stroke="#1f2a25" stroke-width="1"/>
<g transform="translate(1209.5 749) scale(1.5)" fill="none" stroke="#3ddc97" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h14M5 15h14M10.5 4l-2 16M15.5 4l-2 16"/></g>
<text x="1261.5" y="766" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#f1f5f2">JSON and SARIF</text>
<text x="1261.5" y="793" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif" font-size="16.5" font-weight="400" fill="#8d9c94">for scripts and code scanning</text>
<line x1="1179.5" y1="742" x2="1179.5" y2="798" stroke="#1f2a25" stroke-width="1"/>
<rect x="41" y="847" width="14" height="14" rx="3" fill="#f2b84b"/>
<text x="65" y="860" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif" font-size="16" font-weight="400" fill="#8d9c94">A model may draft this. It is validated, never trusted.</text>
<rect x="543.5" y="847" width="14" height="14" rx="3" fill="#3ddc97"/>
<text x="567.5" y="860" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif" font-size="16" font-weight="400" fill="#8d9c94">Runs inside the sandbox.</text>
<rect x="801.1" y="847" width="14" height="14" rx="3" fill="#8fb4ff"/>
<text x="825.1" y="860" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif" font-size="16" font-weight="400" fill="#8d9c94">Observes the run.</text>
<rect x="1003.4" y="847" width="14" height="14" rx="3" fill="#c9d3cd"/>
<text x="1027.4" y="860" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif" font-size="16" font-weight="400" fill="#8d9c94">Deterministic rule.</text>
</svg>
