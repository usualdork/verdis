<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Verdis pipeline">
<title>Verdis pipeline</title>
<desc>Intake, claim, policy, dedupe and preflight; then plan, build, run, oracles and judge; then the evidence bundle, verdict card, draft reply and JSON or SARIF.</desc>
<rect x="0" y="0" width="1600" height="900" fill="#060807"/>
<text x="60" y="70" font-family="'SF Mono', ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="400" fill="#8d9c94" letter-spacing="3">FROM REPORT TO VERDICT</text>
<text x="60" y="108" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#f1f5f2" letter-spacing="-0.6">Every stage is ordered, saved and resumable.</text>
<rect x="41" y="150" width="270" height="188" rx="14" fill="#0c110f" stroke="#1f2a25" stroke-width="1.5"/>
<rect x="41" y="168" width="5" height="152" rx="2.5" fill="#c9d3cd"/>
<g transform="translate(69 174) scale(1.42)" fill="none" stroke="#c9d3cd" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13l3-8h12l3 8v6H3z"/><path d="M3 13h5l1.5 2.5h5L16 13h5"/></g>
<text x="289" y="188" font-family="'SF Mono', ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="400" fill="#4d5a54" text-anchor="end" letter-spacing="1">01</text>
<text x="69" y="250" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif" font-size="29" font-weight="700" fill="#f1f5f2" letter-spacing="-0.4">Intake</text>
<text x="69" y="282" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif" font-size="17.5" font-weight="400" fill="#8d9c94">File, GitHub report,</text>
<text x="69" y="306" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif" font-size="17.5" font-weight="400" fill="#8d9c94">GitHub issue, IMAP</text>
<rect x="353" y="150" width="270" height="188" rx="14" fill="#0c110f" stroke="#1f2a25" stroke-width="1.5"/>
<rect x="353" y="168" width="5" height="152" rx="2.5" fill="#f2b84b"/>
<g transform="translate(381 174) scale(1.42)" fill="none" stroke="#f2b84b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16v4M17 18h4"/></g>
<text x="601" y="188" font-family="'SF Mono', ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="400" fill="#4d5a54" text-anchor="end" letter-spacing="1">02</text>
<text x="381" y="250" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif" font-size="29" font-weight="700" fill="#f1f5f2" letter-spacing="-0.4">Claim</text>
<text x="381" y="282" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif" font-size="17.5" font-weight="400" fill="#8d9c94">Component, class, PoC,</text>
<text x="381" y="306" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif" font-size="17.5" font-weight="400" fill="#8d9c94">expected signal, with spans</text>
<rect x="665" y="150" width="270" height="188" rx="14" fill="#0c110f" stroke="#1f2a25" stroke-width="1.5"/>
<rect x="665" y="168" width="5" height="152" rx="2.5" fill="#c9d3cd"/>
<g transform="translate(693 174) scale(1.42)" fill="none" stroke="#c9d3cd" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></g>
<text x="913" y="188" font-family="'SF Mono', ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="400" fill="#4d5a54" text-anchor="end" letter-spacing="1">03</text>
<text x="693" y="250" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif" font-size="29" font-weight="700" fill="#f1f5f2" letter-spacing="-0.4">Policy</text>
<text x="693" y="282" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif" font-size="17.5" font-weight="400" fill="#8d9c94">Checks the claim against</text>
<text x="693" y="306" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif" font-size="17.5" font-weight="400" fill="#8d9c94">your policy, with citations</text>
<rect x="977" y="150" width="270" height="188" rx="14" fill="#0c110f" stroke="#1f2a25" stroke-width="1.5"/>
<rect x="977" y="168" width="5" height="152" rx="2.5" fill="#c9d3cd"/>
<g transform="translate(1005 174) scale(1.42)" fill="none" stroke="#c9d3cd" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></g>
<text x="1225" y="188" font-family="'SF Mono', ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="400" fill="#4d5a54" text-anchor="end" letter-spacing="1">04</text>
<text x="1005" y="250" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif" font-size="29" font-weight="700" fill="#f1f5f2" letter-spacing="-0.4">Dedupe</text>
<text x="1005" y="282" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif" font-size="17.5" font-weight="400" fill="#8d9c94">Before and after the run:</text>
<text x="1005" y="306" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif" font-size="17.5" font-weight="400" fill="#8d9c94">a suggestion, never a merge</text>
<rect x="1289" y="150" width="270" height="188" rx="14" fill="#0c110f" stroke="#1f2a25" stroke-width="1.5"/>
<rect x="1289" y="168" width="5" height="152" rx="2.5" fill="#c9d3cd"/>
<g transform="translate(1317 174) scale(1.42)" fill="none" stroke="#c9d3cd" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5.5c0 4.6-3 7.6-7 9.5-4-1.9-7-4.9-7-9.5V6z"/><path d="M9 12l2.2 2.2L15.5 10"/></g>
<text x="1537" y="188" font-family="'SF Mono', ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="400" fill="#4d5a54" text-anchor="end" letter-spacing="1">05</text>
<text x="1317" y="250" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif" font-size="29" font-weight="700" fill="#f1f5f2" letter-spacing="-0.4">Preflight</text>
<text x="1317" y="282" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif" font-size="17.5" font-weight="400" fill="#8d9c94">Inspects each attachment</text>
<text x="1317" y="306" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif" font-size="17.5" font-weight="400" fill="#8d9c94">before anything executes</text>
<rect x="41" y="470" width="270" height="188" rx="14" fill="#0c110f" stroke="#1f2a25" stroke-width="1.5"/>
<rect x="41" y="488" width="5" height="152" rx="2.5" fill="#f2b84b"/>
<g transform="translate(69 494) scale(1.42)" fill="none" stroke="#f2b84b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16v4M17 18h4"/></g>
<text x="289" y="508" font-family="'SF Mono', ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="400" fill="#4d5a54" text-anchor="end" letter-spacing="1">06</text>
<text x="69" y="570" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif" font-size="29" font-weight="700" fill="#f1f5f2" letter-spacing="-0.4">Plan</text>
<text x="69" y="602" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif" font-size="17.5" font-weight="400" fill="#8d9c94">Restricted step language,</text>
<text x="69" y="626" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif" font-size="17.5" font-weight="400" fill="#8d9c94">validated before it runs</text>
<rect x="353" y="470" width="270" height="188" rx="14" fill="#0c110f" stroke="#1f2a25" stroke-width="1.5"/>
<rect x="353" y="488" width="5" height="152" rx="2.5" fill="#3ddc97"/>
<g transform="translate(381 494) scale(1.42)" fill="none" stroke="#3ddc97" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></g>
<text x="601" y="508" font-family="'SF Mono', ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="400" fill="#4d5a54" text-anchor="end" letter-spacing="1">07</text>
<text x="381" y="570" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif" font-size="29" font-weight="700" fill="#f1f5f2" letter-spacing="-0.4">Build</text>
<text x="381" y="602" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif" font-size="17.5" font-weight="400" fill="#8d9c94">From a recipe, network</text>
<text x="381" y="626" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif" font-size="17.5" font-weight="400" fill="#8d9c94">only through your mirror</text>
<rect x="665" y="470" width="270" height="188" rx="14" fill="#0c110f" stroke="#1f2a25" stroke-width="1.5"/>
<rect x="665" y="488" width="5" height="152" rx="2.5" fill="#3ddc97"/>
<g transform="translate(693 494) scale(1.42)" fill="none" stroke="#3ddc97" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5l11 7-11 7z"/></g>
<text x="913" y="508" font-family="'SF Mono', ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="400" fill="#4d5a54" text-anchor="end" letter-spacing="1">08</text>
<text x="693" y="570" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif" font-size="29" font-weight="700" fill="#f1f5f2" letter-spacing="-0.4">Run</text>
<text x="693" y="602" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif" font-size="17.5" font-weight="400" fill="#8d9c94">No network, no capabilities,</text>
<text x="693" y="626" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif" font-size="17.5" font-weight="400" fill="#8d9c94">rootless, hard limits</text>
<rect x="977" y="470" width="270" height="188" rx="14" fill="#0c110f" stroke="#1f2a25" stroke-width="1.5"/>
<rect x="977" y="488" width="5" height="152" rx="2.5" fill="#8fb4ff"/>
<g transform="translate(1005 494) scale(1.42)" fill="none" stroke="#8fb4ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></g>
<text x="1225" y="508" font-family="'SF Mono', ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="400" fill="#4d5a54" text-anchor="end" letter-spacing="1">09</text>
<text x="1005" y="570" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif" font-size="29" font-weight="700" fill="#f1f5f2" letter-spacing="-0.4">Oracles</text>
<text x="1005" y="602" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif" font-size="17.5" font-weight="400" fill="#8d9c94">Seven kinds observe the run</text>
<text x="1005" y="626" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif" font-size="17.5" font-weight="400" fill="#8d9c94">and compare it to the claim</text>
<rect x="1289" y="470" width="270" height="188" rx="14" fill="#0c110f" stroke="#1f2a25" stroke-width="1.5"/>
<rect x="1289" y="488" width="5" height="152" rx="2.5" fill="#c9d3cd"/>
<g transform="translate(1317 494) scale(1.42)" fill="none" stroke="#c9d3cd" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M7 21h10M5 7h14"/><path d="M5 7l-3 7a3.2 3.2 0 0 0 6 0zM19 7l-3 7a3.2 3.2 0 0 0 6 0z"/></g>
<text x="1537" y="508" font-family="'SF Mono', ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="400" fill="#4d5a54" text-anchor="end" letter-spacing="1">10</text>
<text x="1317" y="570" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif" font-size="29" font-weight="700" fill="#f1f5f2" letter-spacing="-0.4">Judge</text>
<text x="1317" y="602" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif" font-size="17.5" font-weight="400" fill="#8d9c94">Ordered rules turn the</text>
<text x="1317" y="626" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif" font-size="17.5" font-weight="400" fill="#8d9c94">evidence into a verdict</text>
<path d="M317 244 L347 244" fill="none" stroke="#4d5a54" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M337 250 L347 244 L337 238" fill="none" stroke="#4d5a54" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M317 564 L347 564" fill="none" stroke="#4d5a54" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M337 570 L347 564 L337 558" fill="none" stroke="#4d5a54" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M629 244 L659 244" fill="none" stroke="#4d5a54" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M649 250 L659 244 L649 238" fill="none" stroke="#4d5a54" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M629 564 L659 564" fill="none" stroke="#4d5a54" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M649 570 L659 564 L649 558" fill="none" stroke="#4d5a54" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
