<path d="M1253 564 L1283 564" fill="none" stroke="#4d5a54" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M1273 570 L1283 564 L1273 558" fill="none" stroke="#4d5a54" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1424 342 L1424 404 L176 404 L176 464" fill="none" stroke="#4d5a54" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M170 454 L176 464 L182 454" fill="none" stroke="#4d5a54" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="1219.68" y="352" width="180.32" height="28" rx="14" fill="#0c110f" stroke="#ff6b6b" stroke-width="1.4"/><circle cx="1232.68" cy="366" r="3.5" fill="#ff6b6b"/><text x="1242.68" y="371.04" font-family="'SF Mono', ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="600" fill="#ff6b6b" letter-spacing="0.6">UNSAFE_ATTACHMENT</text>
<text x="1205.68" y="371" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif" font-size="15.5" font-weight="400" fill="#8d9c94" text-anchor="end">risky attachments stop here</text>
